<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-synapse</title>
    <style>
      :root {
        --canvas: #f6f8fa;
        --surface: #ffffff;
        --border: #d1d9e0;
        --border-muted: #d8dee4;
        --neutral: #eaeef2;
        --neutral-hi: #eef1f4;
        --fg: #1f2328;
        --muted: #59636e;
        --faint: #818b98;
        --accent: #0969da;
        --open: #1a7f37;
        --open-bg: #dafbe1;
        --acked: #9a6700;
        --acked-bg: #fff8c5;
        --done: #8250df;
        --done-bg: #fbefff;
        --header: #1f2328;
        --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--canvas); color: var(--fg);
        font-family: var(--ui); font-size: 14px; line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }

      /* header */
      .app-header { background: var(--header); color: #fff; padding: 14px 0; }
      .app-header .inner { max-width: 1280px; margin: 0 auto; padding: 0 32px;
        display: flex; align-items: center; gap: 11px; }
      .app-header .mark { color: #fff; display: flex; }
      .app-header h1 { font-size: 15px; font-weight: 600; margin: 0; }
      .app-header .sub { color: #9da7b3; font-size: 13px; font-weight: 400; }
      .app-header .right { margin-left: auto; }

      /* primer toggle for auto-pickup */
      .toggle { display: inline-flex; align-items: center; gap: 8px; color: #d0d7de; font-size: 12.5px;
        cursor: pointer; user-select: none; }
      .toggle input { position: absolute; opacity: 0; pointer-events: none; }
      .toggle .track { width: 38px; height: 22px; border-radius: 6px; background: #424a53;
        position: relative; transition: background .16s; flex: none; }
      .toggle .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
        border-radius: 4px; background: #fff; transition: transform .16s; }
      .toggle input:checked + .track { background: #238636; }
      .toggle input:checked + .track::after { transform: translateX(16px); }
      .toggle .state { width: 22px; color: #9da7b3; }

      /* layout */
      .container { max-width: 1280px; margin: 0 auto; padding: 24px 32px; }
      .layout { display: grid; grid-template-columns: 1fr 316px; gap: 24px; align-items: start; }
      @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

      /* search */
      .search { position: relative; margin-bottom: 16px; }
      .search input { width: 100%; height: 32px; padding: 0 12px 0 34px; font-family: var(--ui); font-size: 14px;
        background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--fg);
        transition: border-color .15s, box-shadow .15s; }
      .search input::placeholder { color: var(--faint); }
      .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,.25); }
      .search .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); display: flex; }

      /* Box (Primer) */
      .Box { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; }
      .Box-header { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
        background: var(--canvas); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0;
        font-size: 13px; }
      .Box-header h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--fg); }
      .Box-header .count { margin-left: auto; color: var(--muted); font-size: 12px; }
      .Box-body { padding: 8px 16px; }
      .Box-row { display: flex; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border-muted); }
      .Box-row:last-child { border-bottom: none; }
      .Box-row:hover { background: #f6f8fafb; }

      /* issue-style filter tabs */
      .tabs { display: flex; align-items: center; gap: 16px; }
      .tab { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer;
        color: var(--muted); font: inherit; font-size: 13px; padding: 0; }
      .tab:hover { color: var(--fg); }
      .tab.active { color: var(--fg); font-weight: 600; }
      .tab .ti { display: flex; }
      .tab.t-open .ti { color: var(--open); } .tab.t-acked .ti { color: var(--acked); } .tab.t-done .ti { color: var(--done); }

      /* handoff row */
      .state-icon { flex: none; margin-top: 1px; }
      .state-icon.s-open { color: var(--open); } .state-icon.s-acked { color: var(--acked); } .state-icon.s-done { color: var(--done); }
      .row-main { flex: 1; min-width: 0; }
      .row-side { flex: none; display: flex; align-items: center; gap: 8px; }
      .row-title { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
      .row-title .t { font-size: 15px; font-weight: 600; color: var(--fg); letter-spacing: -.01em; }
      .row-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
      .row-meta .id { font-family: var(--mono); }
      .row-meta .read.on { color: var(--open); }
      .row-summary { margin-top: 8px; color: var(--fg); white-space: pre-wrap; }
      .ctx { margin-top: 8px; }
      .ctx summary { cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none; display: inline-flex; align-items: center; gap: 5px; }
      .ctx summary::-webkit-details-marker { display: none; }
      .ctx summary:hover { color: var(--accent); }
      .ctx .body { margin-top: 8px; padding: 12px; background: var(--canvas); border: 1px solid var(--border-muted);
        border-radius: 6px; color: var(--fg); white-space: pre-wrap; font-size: 12.5px; max-height: 280px; overflow: auto; }
      .ctx[open] summary .chev { transform: rotate(90deg); }
      .chev { transition: transform .15s; display: flex; }

      /* Label (Primer) */
      .Label { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; font-size: 11px; font-weight: 500;
        line-height: 1; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
      .Label.proj { color: var(--accent); border-color: rgba(9,105,218,.35); background: rgba(9,105,218,.08); }
      .Label.reply { color: var(--done); border-color: rgba(130,80,223,.35); background: var(--done-bg); font-family: var(--mono); }
      .Label.unread { color: var(--acked); border-color: rgba(154,103,0,.3); background: var(--acked-bg); }

      /* buttons */
      .btn-group { display: inline-flex; margin-top: 12px; }
      .btn { height: 26px; padding: 0 11px; font-family: var(--ui); font-size: 12px; font-weight: 500;
        background: var(--surface); color: var(--fg); border: 1px solid var(--border); cursor: pointer; }
      .btn-group .btn { border-left-width: 0; }
      .btn-group .btn:first-child { border-left-width: 1px; border-radius: 6px 0 0 6px; }
      .btn-group .btn:last-child { border-radius: 0 6px 6px 0; }
      .btn:hover { background: var(--neutral); }
      .btn.on { font-weight: 600; }
      .btn.on.b-open { background: var(--open-bg); color: var(--open); border-color: rgba(26,127,55,.4); }
      .btn.on.b-acked { background: var(--acked-bg); color: var(--acked); border-color: rgba(154,103,0,.4); }
      .btn.on.b-done { background: var(--done-bg); color: var(--done); border-color: rgba(130,80,223,.4); }
      .del { display: flex; background: none; border: none; color: var(--faint); cursor: pointer; padding: 4px; border-radius: 6px; }
      .del:hover { color: #cf222e; background: rgba(207,34,46,.08); }

      /* projects stat list */
      .proj-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border-muted); font-size: 13px; }
      .proj-row:last-child { border-bottom: none; }
      .proj-row .pn { font-weight: 600; }
      .proj-row .nums { margin-left: auto; display: flex; gap: 10px; color: var(--muted); font-size: 12px; align-items: center; }
      .proj-row .nums i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
      .n-open { background: var(--open); } .n-acked { background: var(--acked); } .n-done { background: var(--done); }
      .proj-row .ur { color: var(--acked); font-weight: 600; }

      /* memory */
      .kv { padding: 11px 0; border-bottom: 1px solid var(--border-muted); }
      .kv:last-child { border-bottom: none; }
      .kv .k { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 12.5px; color: var(--accent); margin-bottom: 4px; word-break: break-all; }
      .kv .v { color: var(--fg); white-space: pre-wrap; word-break: break-word; }

      /* project cost chip */
      .proj-row .cost { color: var(--done); font-weight: 600; font-family: var(--mono); }

      /* activity feed */
      .act { display: flex; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--border-muted); font-size: 12.5px; }
      .act:last-child { border-bottom: none; }
      .act .dot { flex: none; margin-top: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
      .act .dot.write { background: var(--accent); } .act .dot.reply { background: var(--done); }
      .act .dot.read { background: var(--open); } .act .dot.status { background: var(--acked); }
      .act .dot.delete { background: #cf222e; } .act .dot.memory { background: var(--faint); }
      .act .ab { min-width: 0; flex: 1; }
      .act .who { font-weight: 600; color: var(--fg); }
      .act .verb { color: var(--muted); }
      .act .tgt { color: var(--fg); }
      .act .t { color: var(--faint); font-size: 11px; margin-top: 1px; }

      .empty { color: var(--muted); padding: 16px; text-align: center; font-size: 13px; }
      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-thumb { background: #d0d7de; border-radius: 8px; border: 3px solid var(--surface); background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background: #afb8c1; background-clip: padding-box; }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="inner">
        <span class="mark"><svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM4.5 7.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm7 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm-3.5 4a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm.7-3.1 1.6-1.6.7.7-1.6 1.6Zm-2-1.6.7-.7 1.6 1.6-.7.7Z"/></svg></span>
        <h1>agent-synapse</h1>
        <span class="sub">shared memory between your agents</span>
        <span class="right">
          <label class="toggle" title="Inject the latest unread handoff into new sessions">
            <input type="checkbox" id="autopickup" onchange="setAuto(this.checked)" />
            <span class="track"></span>
            auto-pickup <span class="state" id="autostate">off</span>
          </label>
        </span>
      </div>
    </header>

    <div class="container">
      <div class="layout">
        <main>
          <div class="search">
            <span class="ico"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg></span>
            <input id="hsearch" placeholder="Search task, summary, context…" oninput="render()" />
          </div>
          <div class="Box">
            <div class="Box-header">
              <div class="tabs" id="htabs"></div>
              <span class="count" id="hcount"></span>
            </div>
            <div id="handoffs"></div>
          </div>
        </main>

        <aside>
          <div class="Box">
            <div class="Box-header"><h2>Projects</h2></div>
            <div class="Box-body" id="stats"></div>
          </div>
          <div class="Box">
            <div class="Box-header"><h2>Activity</h2><span class="count" id="acount"></span></div>
            <div class="Box-body" id="activity"></div>
          </div>
          <div class="Box">
            <div class="Box-header"><h2>Shared memory</h2><span class="count" id="mcount"></span></div>
            <div class="Box-body">
              <div class="search">
                <span class="ico"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg></span>
                <input id="msearch" placeholder="Search key or value…" oninput="render()" />
              </div>
              <div id="memory"></div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const esc = (s) => (s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      const projName = (p) => (p ? p.split(/[\\/]/).pop() : "(none)");
      const when = (iso) => (iso || "").replace("T", " ").replace(/\.\d+Z$/, "").slice(0, 16);

      let DATA = { handoffs: [], memory: [], stats: [], activity: [] };
      let statusFilter = "all";

      // activity action -> [dot class, human verb]
      const ACT = {
        "handoff.write": ["write", "wrote handoff"],
        "handoff.reply": ["reply", "replied to"],
        "handoff.read": ["read", "read handoff"],
        "handoff.status": ["status", "set status of"],
        "handoff.delete": ["delete", "deleted handoff"],
        "memory.set": ["memory", "set memory"],
      };

      // octicons
      const ICON = {
        open: '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"/></svg>',
        acked: '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 4.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"/></svg>',
        done: '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11.28 6.78a.75.75 0 0 0-1.06-1.06L7 8.94 5.78 7.72a.75.75 0 1 0-1.06 1.06l1.75 1.75a.75.75 0 0 0 1.06 0l3.75-3.75Z"/><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"/></svg>',
        chev: '<span class="chev"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06Z"/></svg></span>',
      };

      function renderTabs() {
        const all = DATA.handoffs;
        const c = { open: 0, acked: 0, done: 0 };
        all.forEach((h) => { c[h.status || "open"]++; });
        const tab = (key, label) =>
          '<button class="tab t-' + key + (statusFilter === key ? " active" : "") + '" onclick="setFilter(\'' + key + '\')">' +
          '<span class="ti">' + ICON[key] + "</span>" + c[key] + " " + label + "</button>";
        document.getElementById("htabs").innerHTML =
          '<button class="tab' + (statusFilter === "all" ? " active" : "") + '" onclick="setFilter(\'all\')">All</button>' +
          tab("open", "Open") + tab("acked", "Acked") + tab("done", "Done");
      }

      function setFilter(f) { statusFilter = statusFilter === f && f !== "all" ? "all" : f; render(); }

      function renderStats(rows) {
        const el = document.getElementById("stats");
        if (!rows || !rows.length) { el.innerHTML = '<div class="empty">No handoffs yet.</div>'; return; }
        el.innerHTML = rows.map((s) =>
          '<div class="proj-row"><span class="pn">' + esc(projName(s.project)) + "</span>" +
            '<span class="nums">' +
              (Number(s.cost) > 0 ? '<span class="cost" title="total reported cost">$' + Number(s.cost).toFixed(2) + "</span>" : "") +
              (Number(s.unread) > 0 ? '<span class="ur">' + s.unread + " unread</span>" : "") +
              "<span><i class='n-open'></i>" + s.open + "</span>" +
              "<span><i class='n-acked'></i>" + s.acked + "</span>" +
              "<span><i class='n-done'></i>" + s.done + "</span>" +
            "</span></div>"
        ).join("");
      }

      function renderActivity() {
        const rows = DATA.activity || [];
        document.getElementById("acount").textContent = rows.length;
        const el = document.getElementById("activity");
        if (!rows.length) { el.innerHTML = '<div class="empty">No activity yet.</div>'; return; }
        el.innerHTML = rows.map((a) => {
          const [cls, verb] = ACT[a.action] || ["", a.action];
          const who = esc(a.actor || "someone");
          const tgt =
            a.action === "memory.set" ? ' "' + esc(a.detail) + '"'
            : a.action === "handoff.status" ? " #" + a.target_id + " → " + esc(a.detail)
            : a.target_id != null ? " #" + a.target_id + (a.detail ? ' "' + esc(a.detail) + '"' : "")
            : "";
          const proj = a.project ? ' <span class="Label proj">' + esc(projName(a.project)) + "</span>" : "";
          return '<div class="act"><span class="dot ' + cls + '"></span><div class="ab">' +
            '<div><span class="who">' + who + '</span> <span class="verb">' + esc(verb) + '</span><span class="tgt">' + tgt + "</span>" + proj + "</div>" +
            '<div class="t">' + esc(when(a.at)) + "</div></div></div>";
        }).join("");
      }

      function statusButtons(h) {
        const st = h.status || "open";
        const cap = (s) => s[0].toUpperCase() + s.slice(1);
        return '<div class="btn-group">' + ["open", "acked", "done"].map((s) =>
          '<button class="btn b-' + s + (st === s ? " on" : "") + '" onclick="setStatus(' + h.id + ",'" + s + "')\">" + cap(s) + "</button>"
        ).join("") + "</div>";
      }

      function renderHandoffs() {
        const q = document.getElementById("hsearch").value.trim().toLowerCase();
        const items = DATA.handoffs.filter((h) =>
          (statusFilter === "all" || (h.status || "open") === statusFilter) &&
          (!q || (h.task + " " + h.summary + " " + (h.context || "")).toLowerCase().includes(q)));
        document.getElementById("hcount").textContent = items.length + (items.length === 1 ? " handoff" : " handoffs");
        const el = document.getElementById("handoffs");
        if (!items.length) { el.innerHTML = '<div class="empty">' + (q || statusFilter !== "all" ? "No matching handoffs." : "No handoffs yet.") + "</div>"; return; }
        el.innerHTML = items.map((h) => {
          const st = h.status || "open";
          const read = h.read_at
            ? '<span class="read on" title="' + esc(h.read_at) + '">✓ read' + (h.read_by ? " by " + esc(h.read_by) : "") + "</span>"
            : '<span class="Label unread">unread</span>';
          const reply = h.reply_to ? '<span class="Label reply">↳ #' + h.reply_to + "</span>" : "";
          return (
            '<div class="Box-row">' +
              '<span class="state-icon s-' + st + '" title="' + st + '">' + ICON[st] + "</span>" +
              '<div class="row-main">' +
                '<div class="row-title"><span class="t">' + esc(h.task) + "</span>" +
                  '<span class="Label proj">' + esc(projName(h.project)) + "</span>" + reply + "</div>" +
                '<div class="row-meta"><span class="id">#' + h.id + "</span> · " + esc(when(h.created_at)) +
                  (h.from_agent ? " · by " + esc(h.from_agent) : "") + "</div>" +
                '<div class="row-summary">' + esc(h.summary) + "</div>" +
                (h.context ? '<details class="ctx"><summary>' + ICON.chev + "Context</summary><div class=\"body\">" + esc(h.context) + "</div></details>" : "") +
                statusButtons(h) +
              "</div>" +
              '<div class="row-side">' + read +
                '<button class="del" title="Delete" onclick="del(' + h.id + ')"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11 1.75V3h2.25a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1 0-1.5H5V1.75C5 .784 5.784 0 6.75 0h2.5C10.216 0 11 .784 11 1.75ZM4.5 5.5l.5 8a.75.75 0 0 0 .75.7h4.5a.75.75 0 0 0 .75-.7l.5-8a.75.75 0 1 0-1.5-.1l-.46 7.35H6.46L6 5.4a.75.75 0 1 0-1.5.1ZM6.5 1.75V3h3V1.75a.25.25 0 0 0-.25-.25h-2.5a.25.25 0 0 0-.25.25Z"/></svg></button>' +
              "</div>" +
            "</div>"
          );
        }).join("");
      }

      function renderMemory() {
        const q = document.getElementById("msearch").value.trim().toLowerCase();
        const items = DATA.memory.filter((m) => !q || (m.key + " " + m.value).toLowerCase().includes(q));
        document.getElementById("mcount").textContent = items.length;
        const el = document.getElementById("memory");
        if (!items.length) { el.innerHTML = '<div class="empty">' + (q ? "No matches." : "Empty.") + "</div>"; return; }
        el.innerHTML = items.map((m) => {
          const tag = m.project ? '<span class="Label proj">' + esc(projName(m.project)) + "</span>" : "";
          return '<div class="kv"><div class="k">' + tag + esc(m.key) + '</div><div class="v">' + esc(m.value) + "</div></div>";
        }).join("");
      }

      function render() {
        renderTabs();
        renderStats(DATA.stats);
        renderActivity();
        renderHandoffs();
        renderMemory();
      }

      async function setAuto(on) {
        document.getElementById("autostate").textContent = on ? "on" : "off";
        await fetch("/api/autopickup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: on }) });
      }
      async function setStatus(id, status) {
        await fetch("/api/handoff/" + id + "/status", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }) });
        tick();
      }
      async function del(id) {
        if (!confirm("Delete handoff #" + id + "?")) return;
        await fetch("/api/handoff/" + id, { method: "DELETE" });
        tick();
      }
      async function tick() {
        try {
          const r = await fetch("/api/data");
          const d = await r.json();
          DATA = { handoffs: d.handoffs || [], memory: d.memory || [], stats: d.stats || [], activity: d.activity || [] };
          render();
          const cb = document.getElementById("autopickup");
          if (cb && document.activeElement !== cb) { cb.checked = !!d.auto_pickup; document.getElementById("autostate").textContent = d.auto_pickup ? "on" : "off"; }
        } catch {}
      }
      tick();
      setInterval(tick, 3000);
    </script>
  </body>
</html>

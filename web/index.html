<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-synapse</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #0e1116; color: #d7dde5;
      }
      header {
        padding: 16px 24px; border-bottom: 1px solid #222a35;
        display: flex; align-items: baseline; gap: 12px;
      }
      header h1 { font-size: 16px; margin: 0; color: #fff; }
      header .sub { color: #6b7685; font-size: 12px; }
      .toggle { margin-left: auto; color: #aab4c0; font-size: 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
      .wrap { display: grid; grid-template-columns: 1.6fr 1fr; gap: 0; height: calc(100vh - 58px); }
      .col { padding: 16px 24px; overflow: auto; }
      .col + .col { border-left: 1px solid #222a35; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #6b7685; margin: 0 0 12px; }
      .card { background: #161b22; border: 1px solid #222a35; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
      .card .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 6px; }
      .task { color: #fff; font-weight: 600; }
      .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
      .del { background: none; border: none; color: #6b7685; cursor: pointer; font-size: 14px; padding: 0 4px; line-height: 1; }
      .del:hover { color: #ff6b6b; }
      .top .right { display: flex; align-items: center; gap: 6px; }
      .unread { background: #3a2a00; color: #ffcc66; }
      .read { background: #14301f; color: #6fd49a; }
      .meta { color: #6b7685; font-size: 12px; margin-bottom: 6px; }
      .proj { background: #1b2740; color: #7aa2f7; padding: 1px 7px; border-radius: 4px; margin-right: 6px; }
      .summary { white-space: pre-wrap; }
      .ctx { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #222a35; color: #aab4c0; white-space: pre-wrap; }
      .reply { background: #2a2440; color: #c0a8ff; padding: 1px 7px; border-radius: 4px; margin-right: 6px; }
      .st-open { background: #3a2a00; color: #ffcc66; }
      .st-acked { background: #102a3a; color: #66c2ff; }
      .st-done { background: #14301f; color: #6fd49a; }
      .actions { margin-top: 8px; display: flex; gap: 6px; }
      .actions button { background: #1b222c; border: 1px solid #2a3340; color: #aab4c0; font: inherit; font-size: 11px; padding: 2px 8px; border-radius: 6px; cursor: pointer; }
      .actions button:hover { border-color: #3a4656; color: #fff; }
      .actions button.on { background: #14301f; border-color: #1f5d3a; color: #6fd49a; }
      .stats { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 24px; border-bottom: 1px solid #222a35; font-size: 12px; color: #aab4c0; }
      .stat { background: #161b22; border: 1px solid #222a35; border-radius: 6px; padding: 4px 10px; }
      .stat b { color: #fff; }
      .stat .n { color: #ffcc66; }
      .search { width: 100%; margin-bottom: 12px; padding: 7px 10px; background: #0e1116; border: 1px solid #222a35; border-radius: 6px; color: #d7dde5; font: inherit; }
      .search:focus { outline: none; border-color: #3a4656; }
      .kv { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid #1b2129; }
      .kv .k { color: #7aa2f7; min-width: 120px; word-break: break-all; }
      .kv .v { white-space: pre-wrap; word-break: break-word; }
      .empty { color: #6b7685; font-style: italic; }
    </style>
  </head>
  <body>
    <header>
      <h1>agent-synapse</h1>
      <span class="sub">shared memory between your agents · auto-refresh 3s</span>
      <label class="toggle"><input type="checkbox" id="autopickup" onchange="setAuto(this.checked)" /> auto-pickup</label>
    </header>
    <div class="stats" id="stats"></div>
    <div class="wrap">
      <div class="col">
        <h2>Handoffs</h2>
        <input class="search" id="hsearch" placeholder="search handoffs… (task / summary / context)" oninput="render()" />
        <div id="handoffs"></div>
      </div>
      <div class="col">
        <h2>Shared memory</h2>
        <input class="search" id="msearch" placeholder="search memory… (key / value)" oninput="render()" />
        <div id="memory"></div>
      </div>
    </div>

    <script>
      const esc = (s) => (s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      const projName = (p) => (p ? p.split(/[\\/]/).pop() : "(none)");

      let DATA = { handoffs: [], memory: [], stats: [] };

      function renderStats(rows) {
        const el = document.getElementById("stats");
        if (!rows || !rows.length) { el.innerHTML = '<span class="empty">No handoffs yet.</span>'; return; }
        el.innerHTML = rows.map((s) => {
          const pending = Number(s.total) - Number(s.done);
          return '<span class="stat"><b>' + esc(projName(s.project)) + "</b> · " + s.total + " total · " +
            '<span class="n">' + s.unread + "</span> unread · " + s.open + " open · " + s.acked + " acked · " + s.done + " done · " + pending + " not-done</span>";
        }).join("");
      }

      function statusBadge(h) {
        const st = h.status || "open";
        return '<span class="badge st-' + st + '">' + st + "</span>";
      }

      function statusButtons(h) {
        const st = h.status || "open";
        return ["open", "acked", "done"].map((s) =>
          '<button class="' + (st === s ? "on" : "") + '" onclick="setStatus(' + h.id + ",'" + s + "')\">" + s + "</button>"
        ).join("");
      }

      function renderHandoffs() {
        const q = document.getElementById("hsearch").value.trim().toLowerCase();
        const items = DATA.handoffs.filter((h) => !q ||
          (h.task + " " + h.summary + " " + (h.context || "")).toLowerCase().includes(q));
        const el = document.getElementById("handoffs");
        if (!items.length) { el.innerHTML = '<div class="empty">' + (q ? "No matches." : "No handoffs yet.") + "</div>"; return; }
        el.innerHTML = items.map((h) => {
          const read = h.read_at
            ? '<span class="badge read">read' + (h.read_by ? " · " + esc(h.read_by) : "") + "</span>"
            : '<span class="badge unread">unread</span>';
          const reply = h.reply_to ? '<span class="reply">↳ #' + h.reply_to + "</span>" : "";
          return (
            '<div class="card">' +
              '<div class="top"><span class="task">#' + h.id + " " + esc(h.task) + "</span>" +
                '<span class="right">' + statusBadge(h) + read + '<button class="del" title="Delete" onclick="del(' + h.id + ')">✕</button></span></div>' +
              '<div class="meta">' + reply + '<span class="proj">' + esc(projName(h.project)) + "</span>" + (h.from_agent ? "from " + esc(h.from_agent) + " · " : "") + esc(h.created_at) + "</div>" +
              '<div class="summary">' + esc(h.summary) + "</div>" +
              (h.context ? '<div class="ctx">' + esc(h.context) + "</div>" : "") +
              '<div class="actions">' + statusButtons(h) + "</div>" +
            "</div>"
          );
        }).join("");
      }

      function renderMemory() {
        const q = document.getElementById("msearch").value.trim().toLowerCase();
        const items = DATA.memory.filter((m) => !q ||
          (m.key + " " + m.value).toLowerCase().includes(q));
        const el = document.getElementById("memory");
        if (!items.length) { el.innerHTML = '<div class="empty">' + (q ? "No matches." : "Shared memory is empty.") + "</div>"; return; }
        el.innerHTML = items.map((m) => {
          const tag = m.project ? '<span class="proj">' + esc(projName(m.project)) + "</span>" : "";
          return '<div class="kv"><span class="k">' + tag + esc(m.key) + '</span><span class="v">' + esc(m.value) + "</span></div>";
        }).join("");
      }

      function render() {
        renderStats(DATA.stats);
        renderHandoffs();
        renderMemory();
      }

      async function setAuto(on) {
        await fetch("/api/autopickup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: on }),
        });
      }

      async function setStatus(id, status) {
        await fetch("/api/handoff/" + id + "/status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status }),
        });
        tick();
      }

      async function del(id) {
        if (!confirm("Delete handoff #" + id + "?")) return;
        await fetch("/api/handoff/" + id, { method: "DELETE" });
        tick();
      }

      async function tick() {
        try {
          const r = await fetch("/api/data");
          const d = await r.json();
          DATA = { handoffs: d.handoffs || [], memory: d.memory || [], stats: d.stats || [] };
          render();
          const cb = document.getElementById("autopickup");
          if (cb && document.activeElement !== cb) cb.checked = !!d.auto_pickup;
        } catch {}
      }
      tick();
      setInterval(tick, 3000);
    </script>
  </body>
</html>
